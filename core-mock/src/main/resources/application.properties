spring.application.name=core-mock
server.port=8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Chaos: mặc định tắt. Bật khi demo sự cố, hoặc đổi lúc chạy qua PUT /core/admin/chaos
core-mock.chaos.posting-delay-ms=0
core-mock.chaos.posting-failure-rate=0
core-mock.chaos.inquiry-failure-rate=0

# --- Tracing ---
# Lấy mẫu 100% request (môi trường học). Production thường 1-10%.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
