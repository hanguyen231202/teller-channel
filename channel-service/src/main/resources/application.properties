spring.application.name=channel-service
server.port=8080

# --- Database ---
# Mặc định: H2 in-memory ở chế độ Oracle, chạy được ngay không cần Docker.
# Chạy với Oracle thật: --spring.profiles.active=oracle (xem application-oracle.properties)
spring.datasource.url=jdbc:h2:mem:teller;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway sở hữu schema; Hibernate không tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
# Không giữ kết nối DB suốt request (tránh query lén ở tầng view)
spring.jpa.open-in-view=false
# Lưu Instant vào cột TIMESTAMP theo giờ UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
