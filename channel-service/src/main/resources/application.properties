spring.application.name=channel-service
server.port=8080

# --- Database ---
# Mặc định: H2 in-memory ở chế độ Oracle, chạy được ngay không cần Docker.
# Chạy với Oracle thật: --spring.profiles.active=oracle (xem application-oracle.properties)
spring.datasource.url=jdbc:h2:mem:teller;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway sở hữu schema; Hibernate không tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
# Không giữ kết nối DB suốt request (tránh query lén ở tầng view)
spring.jpa.open-in-view=false
# Lưu Instant vào cột TIMESTAMP theo giờ UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Security ---
# Khóa ký JWT (HS256, tối thiểu 32 byte). Môi trường thật: đặt qua biến môi trường JWT_SECRET, không commit.
teller.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
teller.security.token-ttl=30m
teller.security.issuer=teller-channel
# Mật khẩu chung cho các user demo (gdv01, gdv02, ksv01, ksv02)
teller.security.demo-password=${DEMO_PASSWORD:Teller@123}

# --- Kết nối core ---
teller.core.base-url=${CORE_BASE_URL:http://localhost:8081}
# connect timeout: bắt tay TCP. Quá hạn = chắc chắn chưa gửi được gì
teller.core.connect-timeout=2s
# read timeout: chờ core trả lời. Quá hạn = KHÔNG biết core đã hạch toán chưa
teller.core.read-timeout=5s
# Hạch toán chỉ retry khi chắc chắn chưa tới core (không kết nối được)
teller.core.posting-max-attempts=2
# Tra cứu (đọc) retry được với mọi lỗi kỹ thuật
teller.core.inquiry-max-attempts=3
teller.core.retry-backoff=200ms

# --- Đối soát ---
teller.reconciliation.enabled=true
# Chạy lại sau khi lần trước xong 30s (ISO-8601)
teller.reconciliation.fixed-delay=PT30S
# Chỉ đối soát giao dịch đã gửi core ít nhất 30s: phải lớn hơn tổng thời gian chờ core của luồng duyệt,
# nếu không job có thể hỏi core khi lệnh vẫn đang được xử lý và kết luận sai là "chưa hạch toán".
teller.reconciliation.min-age=30s
teller.reconciliation.batch-size=50
# Hỏi quá 10 lần vẫn không được thì dừng tự động, chờ xử lý tay
teller.reconciliation.max-attempts=10

# --- Tracing ---
# Lấy mẫu 100% request (môi trường học). Production thường 1-10%.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# --- Sự kiện / Kafka ---
# Tắt mặc định để chạy được không cần Kafka (khi tắt, sự kiện chỉ được ghi log)
teller.events.kafka.enabled=${KAFKA_ENABLED:false}
teller.events.topic=teller.transaction.completed
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all + idempotence: broker không ghi trùng khi producer gửi lại
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
